<div class="news-modal">
    <!-- The modal header identifies which city feed is currently displayed. -->
    <div class="modal-header">
        <div>
            <p class="eyebrow">Latest headlines</p>
            <h2 class="modal-title">{{ cityName }} news</h2>
        </div>
        <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
    </div>

    <div class="modal-body">
        <div class="news-state" *ngIf="loading">
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            Loading the latest stories…
        </div>

        <div class="news-state error" *ngIf="!loading && errorMessage">
            <p>{{ errorMessage }}</p>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="loadNews()">Try again</button>
        </div>

        <!-- Links open the publisher/Google News result without replacing the app. -->
        <ol class="story-list" *ngIf="!loading && stories.length">
            <li *ngFor="let story of stories">
                <a [href]="story.link" target="_blank" rel="noopener noreferrer">{{ story.title }}</a>
                <div class="story-meta">
                    <span *ngIf="story.author">{{ story.author }}</span>
                    <time [attr.datetime]="story.pubDate">{{ story.pubDate | date:'medium' }}</time>
                </div>
            </li>
        </ol>
    </div>

    <div class="modal-footer">
        <span>Stories from Google News</span>
        <button type="button" class="btn btn-secondary" (click)="activeModal.close()">Close</button>
    </div>
</div>
