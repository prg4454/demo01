<div class="container-fluid mt-3 app-grid-container">
    <div class="sticky-header automobiles-sticky-header">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Automobiles Inventory</h2>
            <div class="d-flex align-items-center gap-2">
                <app-export-dropdown [rows]="automobiles" fileBaseName="export-automobiles"
                    (statusMessage)="exportMessage = $event"></app-export-dropdown>
                <button type="button" class="btn btn-primary" (click)="openAddModal()">+ Add Automobile</button>
            </div>
        </div>
        @if (exportMessage) {
        <div class="small text-muted mb-2">{{ exportMessage }}</div>
        }
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="previousPage()"
                [disabled]="currentPage <= 1">&lt;&lt;</button>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="nextPage()"
                [disabled]="currentPage >= totalPages">&gt;&gt;</button>
            <div class="small text-muted">Page {{ currentPage }} of {{ totalPages }}</div>
        </div>
    </div>

    <div class="text-break">
    @for (car of pagedAutomobiles; track car.id) {
    <div class="app-grid-row automobiles-grid-row border-bottom">
        <div class="mb-1">
            <b>VIN</b>
            <button type="button" class="grid-link" (click)="openEditModal(car)">
                {{ car.vin }}
            </button>
        </div>
        <div class="mb-1">
            <b>Make</b>
            {{ car.make }}
        </div>
        <div class="mb-1">
            <b>Model</b>
            {{ car.model }}
        </div>
        <div class="mb-1">
            <b>Year</b>
            {{ car.year }}
        </div>
        <div class="mb-1">
            <b>Color</b>
            {{ car.color }}
        </div>
        <div class="mb-1">
            <b>Status</b>
            {{ car.status }}
        </div>
    </div>
    }
    </div>
</div>
