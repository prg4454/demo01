<div class="container mt-3 app-grid-container">
    <div class="sticky-header">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Pens and Pencils</h2>
            <button type="button" class="btn btn-primary" (click)="openAddModal()">+ Add Item</button>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="previousPage()"
                [disabled]="currentPage <= 1">&lt;&lt;</button>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="nextPage()"
                [disabled]="currentPage >= totalPages">&gt;&gt;</button>
            <div class="small text-muted">Page {{ currentPage }} of {{ totalPages }}</div>
        </div>
    </div>

    <div class="text-break">
        @for (record of pagedRecords; track record.id) {
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 align-items-start app-grid-row border-bottom">
            <div class="mb-1 col">
                <b>Brand</b>
                <button type="button" class="grid-link" (click)="openEditModal(record)">
                    {{ record.brand }}
                </button>
            </div>
            <div class="mb-1 col">
                <b>Type</b>
                {{ record.type }}
            </div>
            <div class="mb-1 col">
                <b>Color</b>
                {{ record.color }}
            </div>
            <div class="mb-1 col">
                <b>Tip / Lead</b>
                {{ record.pointOrLead }}
            </div>
            <div class="mb-1 col">
                <b>Count</b>
                {{ record.count }}
            </div>
            <div class="mb-1 col">
                <b>Location</b>
                {{ record.location }}
            </div>
        </div>
        }
    </div>
</div>
