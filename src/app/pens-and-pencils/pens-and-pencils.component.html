<div class="container mt-3 app-grid-container">
    <div class="sticky-header">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Pens and Pencils</h2>
            <button type="button" class="btn btn-primary" (click)="openAddModal()">+ Add Item</button>
        </div>
    </div>

    <div class="pens-table-scroll">
        <table class="pens-table">
            <thead>
                <tr>
                    <th scope="col">Brand</th>
                    <th scope="col">Type</th>
                    <th scope="col">Color</th>
                    <th scope="col">Tip / Lead</th>
                    <th scope="col">Count</th>
                    <th scope="col">Location</th>
                </tr>
            </thead>
            <tbody>
                @for (record of records; track record.id) {
                <tr>
                    <th scope="row">
                        <button type="button" class="grid-link" (click)="openEditModal(record)">
                            {{ record.brand }}
                        </button>
                    </th>
                    <td>{{ record.type }}</td>
                    <td>{{ record.color }}</td>
                    <td>{{ record.pointOrLead }}</td>
                    <td>{{ record.count }}</td>
                    <td>{{ record.location }}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
